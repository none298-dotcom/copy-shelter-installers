name: Engine on Linux and Windows

# Copy Shelter's source is private, and Actions minutes on a private repo are
# billed (the account's limit blocks them). Public repos get Linux and Windows
# machines free, so the machines live here and fetch the private source with a
# read-only deploy key (secret PRIVATE_REPO_SSH_KEY). Nothing private is ever
# committed to this repo; logs show build output only.
#
#   gh workflow run engine.yml --repo none298-dotcom/copy-shelter-installers \
#     -f ref=<branch or full sha> [-f swift=6.4.0] [-f tests=<swift test --filter regex>]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or full 40 character SHA of none298-dotcom/copy-shelter
        required: true
        default: build/m2-repository-core
      swift:
        description: Swift release (match the Mac's toolchain)
        default: "6.4.0"
      tests:
        description: swift test --filter pattern (empty runs every test the platform builds)
        default: ""

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    # `/tmp` on this runner is tmpfs and refuses extended attributes
    # (`setxattr` answers ENOTSUP), which several test fixtures need for a
    # real xattr round trip. `$GITHUB_WORKSPACE` is the checkout's own
    # ext4, which supports them, so tests that call `NSTemporaryDirectory()`
    # get a real filesystem instead by way of `TMPDIR`, the environment
    # variable Foundation's temporary-directory lookup already checks first.
    env:
      TMPDIR: ${{ github.workspace }}/.tmp-tests
    steps:
      - uses: actions/checkout@v4
        with:
          repository: none298-dotcom/copy-shelter
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
      - name: Swift toolchain
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils git gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev \
            libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libncurses-dev libz3-dev pkg-config tzdata unzip zlib1g-dev
          V="${{ inputs.swift }}"
          curl -fsSL "https://download.swift.org/swift-${V}-release/ubuntu2404/swift-${V}-RELEASE/swift-${V}-RELEASE-ubuntu24.04.tar.gz" -o swift.tar.gz
          sudo tar -xzf swift.tar.gz --directory / --strip-components=1
          rm swift.tar.gz
      - run: mkdir -p "$TMPDIR"
      - run: swift --version
      - run: ls Sources && ls Sources/CopyShelteriOSCore Sources/CopyShelterTransfer && git log --oneline -1
      - run: swift build --product csctl
      - run: swift test ${{ inputs.tests != '' && format('--filter "{0}"', inputs.tests) || '' }}
      - run: .build/debug/csctl --help || true

  fedora:
    runs-on: ubuntu-24.04
    container: fedora:41
    # See the ubuntu job's comment: the same tmpfs-`/tmp`-has-no-xattr-support
    # gap applies inside this container too.
    env:
      TMPDIR: ${{ github.workspace }}/.tmp-tests
    steps:
      - name: Swift toolchain and build prerequisites
        run: |
          set -eux
          dnf -y install git openssh-clients binutils gcc gnupg2 zip unzip libcurl-devel libedit-devel \
            libicu-devel sqlite-devel libuuid-devel libxml2-devel python3-devel libstdc++-devel libstdc++-static
          V="${{ inputs.swift }}"
          curl -fsSL "https://download.swift.org/swift-${V}-release/fedora41/swift-${V}-RELEASE/swift-${V}-RELEASE-fedora41.tar.gz" -o swift.tar.gz
          tar -xzf swift.tar.gz --directory / --strip-components=1
          rm swift.tar.gz
      - uses: actions/checkout@v4
        with:
          repository: none298-dotcom/copy-shelter
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
      - run: mkdir -p "$TMPDIR"
      - run: swift --version
      - run: swift build --product csctl
      - run: swift test ${{ inputs.tests != '' && format('--filter "{0}"', inputs.tests) || '' }}

  windows:
    # Pinned: a moving windows-latest image has already broken a sibling app.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: none298-dotcom/copy-shelter
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ inputs.swift }}-release
          swift-build: ${{ inputs.swift }}-RELEASE
      - run: swift --version
      - run: swift build --product csctl
      - run: swift test ${{ inputs.tests != '' && format('--filter "{0}"', inputs.tests) || '' }}
