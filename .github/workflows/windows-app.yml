name: Windows app

# Builds csctl.exe (release) and the Windows app with the engine inside, packages the MSI and
# EXE, then runs the app on the runner's desktop and screenshots it. Nothing is published: the
# packages and screenshots are one-day artifacts, held for the owner's approval.
#
#   gh workflow run windows-app.yml --repo none298-dotcom/copy-shelter-installers -f ref=<branch or full sha>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or full 40 character SHA of none298-dotcom/copy-shelter
        required: true
        default: build/m2-repository-core
      swift:
        description: Swift release (match the Mac's toolchain)
        default: "6.4.0"
      drive:
        description: PowerShell run against the app after it starts (screens to visit)
        default: ""

jobs:
  app:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write   # Azure federated login for Trusted Signing; no stored password
    # `secrets` cannot be read in a step's `if:`, so the job carries the ids.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: none298-dotcom/copy-shelter
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-${{ inputs.swift }}-release
          swift-build: ${{ inputs.swift }}-RELEASE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 for the app's toolchain, 21 to run Gradle (a Wear plugin needs it); the last is JAVA_HOME.
          java-version: |
            17
            21
      - name: Engine
        shell: pwsh
        run: |
          # Windowless: started by the app, a console program would open a black console window
          # of its own. Pipes to the app work the same.
          # A resource bundle copy can trip on a file lock the first time; build again.
          foreach ($i in 1..3) { swift build -c release --product csctl -Xlinker /SUBSYSTEM:WINDOWS -Xlinker /ENTRY:mainCRTStartup; if ($LASTEXITCODE -eq 0) { break } }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $engine = "$env:RUNNER_TEMP\engine"
          New-Item -ItemType Directory -Force $engine | Out-Null
          Copy-Item .build\release\csctl.exe $engine
          Get-ChildItem .build\release -Directory -Filter *.resources | Copy-Item -Destination $engine -Recurse
          $core = (Get-Command swiftCore.dll -ErrorAction Stop).Source
          Copy-Item (Join-Path (Split-Path $core) *.dll) $engine
          Get-ChildItem $engine | Format-Table Name, Length
      - name: App and packages
        working-directory: Apps/CopyShelterKotlin
        shell: pwsh
        run: |
          ./gradlew --no-daemon "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64" :desktop:createDistributable :desktop:packageMsi :desktop:packageExe "-PcsctlWindows=$env:RUNNER_TEMP\engine\csctl.exe"
          Get-ChildItem -Recurse desktop\build\compose\binaries -Include *.msi,*.exe | Format-Table FullName, Length
      # Authenticode with Azure Trusted Signing, the same account and certificate profile as the
      # owner's other Windows apps (MyLinedChart: mlcsigning / mlc-public-trust). The login is a
      # GitHub OIDC federated credential on the mlc-github-signing app, scoped to this repo's main
      # branch, so the repo holds no password. Until that credential and the three AZURE_* ids
      # exist here, both steps skip and the installers stay unsigned.
      - name: Azure login (federated)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the installers (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files-folder: ${{ github.workspace }}\Apps\CopyShelterKotlin\desktop\build\compose\binaries\main
          files-folder-filter: msi,exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Run and look
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shots = "$env:RUNNER_TEMP\shots"
          New-Item -ItemType Directory -Force $shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$shots\$name.png")
            $g.Dispose(); $bmp.Dispose()
          }
          # NVDA reads a Java app through the Java Access Bridge.
          & "$env:JAVA_HOME\bin\jabswitch.exe" -enable
          $app = Get-ChildItem -Recurse "Apps\CopyShelterKotlin\desktop\build\compose\binaries\main\app" -Filter "Copy Shelter.exe" | Select-Object -First 1
          Get-ChildItem (Join-Path $app.DirectoryName "app\resources") -ErrorAction SilentlyContinue | Format-Table Name
          # The launcher hides why the JVM would not start; the same runtime and classes, run
          # directly, say it.
          $dir = $app.DirectoryName
          Get-Content (Join-Path $dir "app\Copy Shelter.cfg")
          $opts = (Get-Content (Join-Path $dir "app\Copy Shelter.cfg") | Where-Object { $_ -like "java-options=*" }) -replace "^java-options=", "" -replace '\$APPDIR', (Join-Path $dir "app")
          $main = ((Get-Content (Join-Path $dir "app\Copy Shelter.cfg") | Where-Object { $_ -like "app.mainclass=*" }) -replace "^app.mainclass=", "")
          # Same classes and the same modules as the package's trimmed runtime, on a full Java.
          $mods = ((Get-Content (Join-Path $dir "runtime\release") | Where-Object { $_ -like "MODULES=*" }) -replace '^MODULES="?', '' -replace '"$', '') -split ' ' -join ','
          "modules: $mods"
          $opts = @($opts | ForEach-Object { if ($_ -match ' ') { '"' + $_ + '"' } else { $_ } })
          $probe = Start-Process "$env:JAVA_HOME_17_X64\bin\java.exe" -ArgumentList (@("--limit-modules", $mods) + @($opts) + @("-cp", "`"$(Join-Path $dir 'app\*')`"", $main)) -RedirectStandardError "$shots\java-err.txt" -RedirectStandardOutput "$shots\java-out.txt" -PassThru
          Start-Sleep 25
          Get-Content "$shots\java-err.txt" -Tail 80
          Get-Content "$shots\java-out.txt" -Tail 20
          Shot "00-direct"
          # The whole tree: the engine it started would keep its console window open.
          taskkill /T /F /PID $probe.Id | Out-Null
          Start-Sleep 2
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep 25
          Shot "01-start"
          $shell = New-Object -ComObject WScript.Shell
          function Keys($k, $name) { [void]$shell.AppActivate($p.Id); Start-Sleep 1; $shell.SendKeys($k); Start-Sleep 4; Shot $name }
          # NVDA, with its speech written to a log: what a blind person would hear.
          Invoke-WebRequest https://download.nvaccess.org/releases/2024.4.2/nvda_2024.4.2.exe -OutFile "$env:RUNNER_TEMP\nvda.exe"
          Start-Process "$env:RUNNER_TEMP\nvda.exe" -ArgumentList "--install-silent" -Wait
          # No welcome or update windows to take the focus from the app.
          New-Item -ItemType Directory -Force "$env:APPDATA\nvda" | Out-Null
          "[general]`nshowWelcomeDialogAtStartup = False`n[update]`nautoCheck = False`naskedAllowUsageStats = True`n" | Set-Content "$env:APPDATA\nvda\nvda.ini"
          $nvda = Get-ChildItem "${env:ProgramFiles(x86)}\NVDA", "$env:ProgramFiles\NVDA" -Filter nvda.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          "NVDA at $($nvda.FullName)"
          Start-Process $nvda.FullName -ArgumentList "--debug-logging", "-f", "`"$shots\nvda.log`""
          Start-Sleep 15
          [void]$shell.AppActivate($p.Id); Start-Sleep 3
          foreach ($i in 1..11) { $shell.SendKeys("{TAB}"); Start-Sleep 2 }
          Shot "02-nvda-walk"
          ${{ inputs.drive }}
          Start-Process $nvda.FullName -ArgumentList "-q" -Wait
          "---- NVDA said ----"
          Select-String -Path "$shots\nvda.log" -Pattern "Speaking" | ForEach-Object { $_.Line } | Select-Object -Last 80
          Start-Sleep 2
          Shot "99-end"
          Get-Process | Where-Object { $_.ProcessName -match 'csctl|Copy Shelter' } | Format-Table ProcessName, Id, MainWindowTitle
          Get-ChildItem -Recurse "$env:LOCALAPPDATA\Copy Shelter" -ErrorAction SilentlyContinue | Format-Table FullName, Length
          Get-ChildItem -Recurse "$env:LOCALAPPDATA\Copy Shelter" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 60 }
          Get-Content "$env:USERPROFILE\.copyshelter\desktop.log" -Tail 80 -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Store package, installed and started
        # Windows PowerShell: the Appx module does not load in PowerShell 7 on the runner.
        shell: powershell
        run: |
          # Test identity only: Partner Center assigns the real Name and Publisher. Nothing is uploaded.
          $root = "Apps\CopyShelterKotlin\desktop"
          $app = Get-ChildItem -Recurse "$root\build\compose\binaries\main\app" -Directory -Filter "Copy Shelter" | Select-Object -First 1
          $stage = "$env:RUNNER_TEMP\msix"
          Copy-Item -Recurse $app.FullName $stage
          Copy-Item -Recurse "$root\packaging\windows-store\Assets" "$stage\Assets"
          $subject = "CN=Copy Shelter Test"
          (Get-Content -Raw "$root\packaging\windows-store\AppxManifest.xml").Replace('STORE_NAME','CopyShelter.Test').Replace('STORE_PUBLISHER',$subject).Replace('VERSION','0.1.0.0') | Set-Content -NoNewline "$stage\AppxManifest.xml"
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object FullName -match 'x64' | Sort-Object FullName | Select-Object -Last 1
          $sign = Join-Path $kit.DirectoryName signtool.exe
          & $kit.FullName pack /o /d $stage /p "$env:RUNNER_TEMP\CopyShelter.msix"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\test.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          & $sign sign /fd SHA256 /sha1 $cert.Thumbprint "$env:RUNNER_TEMP\CopyShelter.msix"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-AppxPackage "$env:RUNNER_TEMP\CopyShelter.msix"
          $pkg = Get-AppxPackage CopyShelter.Test
          $pkg | Format-List Name, Version, InstallLocation, PackageFamilyName
          Get-ChildItem "$($pkg.InstallLocation)\app\resources" -ErrorAction SilentlyContinue | Format-Table Name, Length
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!CopyShelter"
          Start-Sleep 40
          Get-Process | Where-Object { $_.Path -like "*WindowsApps*" } | Format-Table Name, Id, Path
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\shots" | Out-Null
          $bmp.Save("$env:RUNNER_TEMP\shots\store-package.png")
          Get-Content "$env:USERPROFILE\.copyshelter\desktop.log" -Tail 40 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: ${{ runner.temp }}/shots
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages-held
          path: |
            Apps/CopyShelterKotlin/desktop/build/compose/binaries/main/msi/*.msi
            Apps/CopyShelterKotlin/desktop/build/compose/binaries/main/exe/*.exe
            ${{ runner.temp }}/CopyShelter.msix
          retention-days: 1
